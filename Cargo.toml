[package]
name = "ngiab-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
csv = "1.4.0"
dirs = "7.0.0"
libc = "0.2.191"
netcdf = "0.12"
portable-pty = "0.9.0"
ratatui = "0.30"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
vt100 = "0.18.1"

[features]
# Statically link netcdf/hdf5 (used for the container build, mirrors bmi-driver / rs_route)
static = ["netcdf/static"]

[profile.release]
lto = "thin"
